
name: Build and Push Java App to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t java-ecr-demo:npe .

      - name: Tag Docker Image
        run: docker tag java-ecr-demo:npe 884264985159.dkr.ecr.us-east-2.amazonaws.com/java-ecr-demo:npe

      - name: Push Docker Image
        run: docker push 884264985159.dkr.ecr.us-east-2.amazonaws.com/java-ecr-demo:npe
